<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' https://www.gstatic.com;
             style-src  'self' https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline';
             font-src   'self' https://fonts.gstatic.com;
             connect-src 'self'
               https://www.gstatic.com
               https://*.firebaseio.com
               https://*.googleapis.com
               https://identitytoolkit.googleapis.com
               wss://*.firebaseio.com;
             img-src    'self' data:;
             frame-src  'none';
             object-src 'none';
             base-uri   'self'"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <title>Control Financiero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!-- LOADING -->
  <div id="loading" role="status" aria-live="polite">
    <div class="loading-inner">
      <div class="loading-logo" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="10" fill="#1c1c1e"/>
          <path d="M10 22l6-8 4 5 3-4 6 7" stroke="white" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div class="loading-title">Control Financiero</div>
      <div class="loading-sub" id="loading-sub">Iniciando…</div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="loginForm" style="display:none" role="main">
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <rect width="40" height="40" rx="12" fill="#1c1c1e"/>
              <path d="M11 25l7-9 4.5 6 3.5-5 7 8" stroke="white" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
          <h1 class="login-title">Control Financiero</h1>
          <p class="login-sub">Ingresá con tu cuenta para continuar</p>
        </div>
        <div class="login-form" role="form">
          <div class="field-group">
            <label class="field-label" for="email">Email</label>
            <input type="email" id="email" class="field-input"
              placeholder="tu@email.com" autocomplete="username"
              autocapitalize="none" spellcheck="false"/>
          </div>
          <div class="field-group">
            <label class="field-label" for="password">Contraseña</label>
            <input type="password" id="password" class="field-input"
              placeholder="••••••••" autocomplete="current-password"/>
          </div>
          <button type="button" id="btnLogin" class="login-btn">Ingresar</button>
          <div id="loginError" class="login-err" role="alert"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none" role="main"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>

  <!-- Módulos en orden de dependencia -->
  <script src="state.js"></script>
  <script src="utils.js"></script>
  <script src="firebase.js"></script>
  <script src="app.js"></script>

</body>
</html>
