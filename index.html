<title>Control Financiero</title>
<style>
:root{
  --bg:#0D1B2A;--bg2:#112240;--bg3:#1a3050;--bg4:#0d1625;
  --acc:#3b82f6;--acc2:#60a5fa;
  --pos:#34d399;--neg:#f87171;--warn:#fbbf24;--pur:#c084fc;--ora:#fb923c;
  --txt:#e2e8f0;--txt2:#94a3b8;--txt3:#cbd5e1;--brd:#1e3a5f;--rad:8px;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:13px;min-height:100vh}
.app{max-width:1500px;margin:0 auto;padding:10px}
h1{font-size:20px;font-weight:700;color:var(--acc2)}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-box{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:40px 36px;width:340px;text-align:center}
.login-box h2{color:var(--acc2);font-size:22px;margin-bottom:6px}
.login-box p{color:var(--txt2);font-size:12px;margin-bottom:28px}
.login-box input{background:var(--bg3);border:1px solid var(--brd);color:var(--txt);padding:10px 12px;border-radius:7px;font-size:14px;width:100%;margin-bottom:12px;outline:none;transition:border .15s}
.login-box input:focus{border-color:var(--acc)}
.login-box button{background:var(--acc);color:#fff;border:none;border-radius:7px;padding:11px;width:100%;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;margin-top:4px}
.login-box button:hover{background:#2563eb}
.login-err{color:var(--neg);font-size:12px;margin-top:10px;min-height:18px}
.sync-bar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--txt2)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.err{background:var(--neg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* TABS */
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg2);padding:8px;border-radius:var(--rad);margin-bottom:12px}
.tab{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500;background:transparent;color:var(--txt2);transition:all .18s}
.tab.active{background:var(--bg3);color:var(--acc2)}
.tab:hover:not(.active){background:var(--bg3);color:var(--txt)}
.card{background:var(--bg2);border-radius:var(--rad);padding:14px;margin-bottom:12px;border:1px solid var(--brd)}
.sec-title{font-size:13px;font-weight:600;color:var(--acc2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--bg3);border-radius:var(--rad);padding:12px;text-align:center;border:1px solid var(--brd)}
.kpi-lbl{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.kpi-val{font-size:18px;font-weight:700;line-height:1.1}
.pos{color:var(--pos)}.neg{color:var(--neg)}.neu{color:var(--acc2)}.yel{color:var(--warn)}.pur{color:var(--pur)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg3);color:var(--txt2);padding:6px 8px;text-align:left;font-weight:500;font-size:11px;white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:5px 8px;border-bottom:1px solid var(--brd);vertical-align:middle}
tr:hover td{background:#1a3050aa}
.total-row td{font-weight:700;color:var(--acc2);border-top:2px solid var(--brd);background:var(--bg3)}
.badge{padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;display:inline-block}
.pagado{background:#065f4680;color:var(--pos);border:1px solid #065f46}
.pendiente{background:#7f1d1d60;color:#fca5a5;border:1px solid #7f1d1d}
.fijo{background:#1e3a5f80;color:var(--acc2)}
.variable{background:#3b2f0060;color:var(--warn)}
.proveedor{background:#2d165760;color:var(--pur)}
input[type=number],input[type=text],input[type=date],select{
  background:var(--bg3);border:1px solid var(--brd);color:var(--txt);
  padding:5px 7px;border-radius:5px;font-size:12px;width:100%;transition:border .15s
}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input.cell{width:95px;text-align:right;padding:3px 5px}
input.catname{background:transparent;border:1px solid transparent;color:var(--acc2);font-weight:500;padding:2px 4px;width:120px}
input.catname:focus{background:var(--bg3);border-color:var(--acc)}
.btn{padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.btn-pri{background:var(--acc);color:#fff}.btn-pri:hover{background:#2563eb}
.btn-sec{background:var(--bg3);color:var(--txt2);border:1px solid var(--brd)}.btn-sec:hover{color:var(--txt)}
.btn-del{background:#dc262640;color:var(--neg);border:1px solid #dc262660}.btn-del:hover{background:#dc2626;color:#fff}
.btn-sm{padding:2px 7px;font-size:11px}
.btn-warn{background:#92400e40;color:var(--warn);border:1px solid #92400e60}
.c-verde{background:#064e3b15;border-left:3px solid var(--pos)}
.c-amarillo{background:#78350f15;border-left:3px solid var(--warn)}
.c-naranja{background:#7c2d1215;border-left:3px solid var(--ora)}
.c-rojo{background:#7f1d1d20;border-left:3px solid var(--neg)}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;background:var(--bg4);padding:10px;border-radius:var(--rad);margin-bottom:10px}
.form-row .f{display:flex;flex-direction:column;gap:3px}
.form-row label{font-size:10px;color:var(--txt2)}
.alert-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;font-size:12px;margin-bottom:4px}
.month-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.month-bar select{width:auto;min-width:130px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.mini-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--brd);font-size:12px}
.mini-row:last-child{border-bottom:none}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;background:var(--bg3);color:var(--txt2);margin:2px}
.proj-row{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:5px;margin-bottom:3px;font-size:12px;background:var(--bg3)}

</style>

function initSPGP(gp,months){
  const s={};gp.forEach(r=>{s[r.cat]={};months.forEach((m,i)=>{if((r.vals[i]||0)>0)s[r.cat][m]="PAGADO";});});return s;
}
function initSPGL(gl,months){
  const s={};gl.forEach(r=>{s[r.cat]={};months.forEach((m,i)=>{if((r.vals[i]||0)>0)s[r.cat][m]="PAGADO";});});return s;
}
function ensureVals(arr,len){arr.forEach(r=>{while(r.vals.length<len)r.vals.push(0);});}
function patchGP(arr){return arr.map(r=>({vcto:r.vcto||"",...r}));}

function buildInitialState() {
  const months = [...BASE_MONTHS];
  return {
    tab:"dashboard", mes:"May-26", months,
    gp: JSON.parse(JSON.stringify(INIT_GP)),
    gl: JSON.parse(JSON.stringify(INIT_GL)),
    ing: JSON.parse(JSON.stringify(INIT_ING)),
    spGP: initSPGP(JSON.parse(JSON.stringify(INIT_GP)), months),
    spGL: initSPGL(JSON.parse(JSON.stringify(INIT_GL)), months),
    terminales:[
      {id:1,nombre:"BPN Pagos",diasHab:2,cupones:[]},
      {id:2,nombre:"BBVA Open Pay",diasHab:5,cupones:[]},
    ],
    echeques:[], brunella:[],
  };
}

let S = buildInitialState();

function applyData(data) {
  if(!data) return;
  const months = data.months || S.months;
  S.tab = data.tab || "dashboard";
  S.mes = data.mes || months[months.length-1];
  S.months = months;
  S.gp = data.gp ? patchGP(data.gp) : S.gp;
  S.gl = data.gl || S.gl;
  S.ing = data.ing || S.ing;
  S.spGP = data.spGP || initSPGP(S.gp, months);
  S.spGL = data.spGL || initSPGL(S.gl, months);
  S.terminales = data.terminales || S.terminales;
  S.echeques = data.echeques || [];
  S.brunella = data.brunella || [];
  ensureVals(S.gp, S.months.length);
  ensureVals(S.gl, S.months.length);
  ensureVals(S.ing, S.months.length);
}

let SAVE_TIMER = null;
function save() {
  if(!usuarioActual) return;
  try { localStorage.setItem("fin_cf_bak", JSON.stringify(S)); } catch(e) {}
  if(SAVE_TIMER) clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(() => saveToCloud(S), 1500);

async function saveToCloud(data) {
  if(!usuarioActual) return;
  SYNC_STATUS = "syncing";
  updateSyncDot();
  try {
    const uid = usuarioActual.uid;
    await db.ref('users/' + uid + '/data').set(data);
    SYNC_STATUS = "ok";
  } catch(e) {
    console.error("Error saving:", e);
    SYNC_STATUS = "err";
  }
  updateSyncDot();
}

function updateSyncDot() {
  const dot = document.getElementById("sync-dot");
  const lbl = document.getElementById("sync-lbl");
  if(!dot) return;
  dot.className = "sync-dot" + (SYNC_STATUS==="syncing"?" syncing":SYNC_STATUS==="err"?" err":"");
  lbl.textContent = SYNC_STATUS==="syncing"?"Guardando...":SYNC_STATUS==="err"?"Error al guardar":"Guardado ✓";
}

// ===================== AUTH =====================
auth.onAuthStateChanged(async user => {

  document.getElementById("loading").style.display = "none";

  console.log("Auth state changed:", user);

  if (user) {

    usuarioActual = user;

    document.getElementById("loginForm").style.display = "none";
    document.getElementById("app").style.display = "block";

    await loadFromCloud();

    render();

    setTimeout(() => {
      const userEmailEl = document.getElementById("userEmail");
      if(userEmailEl){
        userEmailEl.textContent = user.email;
      }

  } else {

    usuarioActual = null;

    document.getElementById("loginForm").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});
document.addEventListener("keydown", e => {

  const loginVisible =
    document.getElementById("loginForm").style.display !== "none";

  if(e.key === "Enter" && loginVisible){
    login();
  }
});
function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorDiv = document.getElementById("loginError");

  if (!email || !password) {
    errorDiv.textContent = "Por favor completa todos los campos";
    return;
  }

  errorDiv.textContent = "Ingresando...";
  
  auth.signInWithEmailAndPassword(email, password)
    .then(userCredential => {
      console.log("Login exitoso:", userCredential.user.email);
      errorDiv.textContent = "";
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
    })
    .catch(error => {
      console.error("Error de login:", error.code, error.message);
      errorDiv.textContent = "Error: " + error.message;
    });
}

window.logout = function() {
  auth.signOut();
}

async function loadFromCloud() {

  if(!usuarioActual) return;

  try {

    SYNC_STATUS = "syncing";
    updateSyncDot();

    const snapshot = await db
      .ref('users/' + usuarioActual.uid + '/data')
      .once('value');

    const cloudData = snapshot.val();

    if(cloudData) {

      applyData(cloudData);

      console.log("Datos cargados desde Firebase");

    } else {

      console.log("Sin datos en Firebase, usando datos por defecto");

      await saveToCloud(S);
    }

    SYNC_STATUS = "ok";

  } catch(e) {

    console.log("Error loading from cloud", e);

    SYNC_STATUS = "err";
  }

  updateSyncDot();
}

// ===================== UTILS =====================
function fmt(n){
  if(n===undefined||n===null||isNaN(n))return"$0";
  const a=Math.abs(Math.round(n));
  return(n<0?"-$":"$")+a.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
}
function pn(v){return parseFloat(v)||0;}
function mesIdx(){return S.mes==="Todos"?-1:S.months.indexOf(S.mes);}
function mesesRange(){return S.mes==="Todos"?S.months:[S.mes];}
function chequeClass(d){if(d<0)return"c-rojo";if(d<=7)return"c-naranja";if(d<=15)return"c-amarillo";return"c-verde";}
function diasColor(d){if(d<0)return"var(--neg)";if(d<=7)return"var(--ora)";if(d<=15)return"var(--warn)";return"var(--pos)";}
function calcTotals(){
  const mr=mesesRange();
  const sum=(arr,fn)=>arr.reduce((s,r)=>mr.reduce((ss,m)=>ss+fn(r,m),s),0);
  const totalIng=sum(S.ing,(r,m)=>r.vals[S.months.indexOf(m)]||0);
  const totalGP=sum(S.gp,(r,m)=>r.vals[S.months.indexOf(m)]||0);
  const totalGL=sum(S.gl,(r,m)=>r.vals[S.months.indexOf(m)]||0);
  const neto=totalIng-totalGP-totalGL;
  return{totalIng,totalGP,totalGL,neto};
}

// ===================== RENDER ENGINE =====================
function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="class")el.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null||c===false||c===undefined)return;
    el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  });
  return el;
}
function on(el,ev,fn){el.addEventListener(ev,fn);return el;}
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(buildApp());
}

function buildDashboard(t){
  const d=h("div",null);

    {lbl:"Gastos Local",val:t.totalGL,cls:"neg"},{lbl:"Resultado Neto",val:t.neto,cls:t.neto>=0?"pos":"neg"},
  ];
  d.appendChild(h("div",{class:"kpi-grid"},...kpis.map(k=>h("div",{class:"kpi"},h("div",{class:"kpi-lbl"},k.lbl),h("div",{class:`kpi-val ${k.cls}`},fmt(k.val))))));
  return d;
}

// ===================== APP SHELL =====================
function buildApp(){
  const t=calcTotals();
  const TABS=[
    {id:"dashboard",lbl:"📊 Dashboard"},{id:"gp",lbl:"👤 G. Personal"},
    {id:"gl",lbl:"🏪 G. Local"},{id:"ing",lbl:"💰 Ingresos"},
  ];
  const wrap=h("div",{class:"app"});

  const hdr=h("div",{style:{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap",marginBottom:"10px"}},
    h("div",{style:{flex:"1"}},h("h1",null,"💼 Control Financiero")),
    h("div",{class:"month-bar"},
      h("span",{style:{fontSize:"12px",color:"var(--txt2)"}},"Usuario: "),
      h("span",{id:"userEmail",style:{fontWeight:"600",color:"var(--acc2)"}},""),
      h("div",{class:"sync-bar"},h("span",{id:"sync-dot",class:"sync-dot"},""),h("span",{id:"sync-lbl",style:{color:"var(--pos)"}},"Guardado ✓")),
      h("button",{class:"btn btn-sec",style:{fontSize:"11px",padding:"3px 10px"},onclick:"window.logout()"},"Cerrar Sesión")
    )
  );
  wrap.appendChild(hdr);

  const tabBar=h("div",{class:"tabs"},...TABS.map(tb=>{
    const btn=h("button",{class:"tab"+(S.tab===tb.id?" active":"")},tb.lbl);
    on(btn,"click",()=>{S.tab=tb.id;save();render();});return btn;
  }));
  wrap.appendChild(tabBar);

  let content;
  if(S.tab==="dashboard")content=buildDashboard(t);
  else if(S.tab==="gp")content=buildGP();
  else if(S.tab==="gl")content=buildGL();
  else if(S.tab==="ing")content=buildIng();
  wrap.appendChild(content);
  return wrap;
}
